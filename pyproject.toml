# ---------------------------------------------------------------------------
# election-intelligence-2026
# ---------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "election-intelligence-2026"
version = "0.1.0"
description = "A Python platform for election forecasting and analysis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Aditya Botta", email = "adityabotta87@gmail.com" }]
keywords = ["elections", "forecasting", "statistics", "data-science"]

classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]

# Runtime dependencies are also declared here so the project is installable
# via `pip install -e .`. requirements.txt mirrors these for pinned installs.
dependencies = [
    "duckdb>=1.1,<2.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "statsmodels>=0.14,<0.15",
    "streamlit>=1.39,<2.0",
    "anthropic>=0.40,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-mock>=3.14,<4.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.11,<2.0",
    "pre-commit>=4.0,<5.0",
    "pandas-stubs>=2.2,<3.0",
    "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
election-intelligence = "election_intelligence.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/election-intelligence-2026"
Repository = "https://github.com/your-org/election-intelligence-2026"

# ---------------------------------------------------------------------------
# Packaging — src layout
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
election_intelligence = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff — linting & formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["election_intelligence"]

# ---------------------------------------------------------------------------
# mypy — static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
packages = ["election_intelligence"]
mypy_path = "src"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
# Third-party libs without complete type information.
module = ["duckdb.*", "statsmodels.*", "streamlit.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "unit: fast, isolated tests with no external dependencies",
    "integration: tests that touch DuckDB, the filesystem, or external APIs",
    "slow: long-running tests, deselected by default in quick runs",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["election_intelligence"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
