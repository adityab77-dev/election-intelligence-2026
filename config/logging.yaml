# ---------------------------------------------------------------------------
# Reference logging configuration (dictConfig schema).
#
# The application configures logging programmatically via
# `election_intelligence.utils.logging_config.configure_logging`, driven by the
# typed LoggingSettings. This file documents an equivalent declarative setup and
# can be loaded explicitly where a static config is preferred (e.g. a service
# runner) with logging.config.dictConfig(yaml.safe_load(...)).
# ---------------------------------------------------------------------------
version: 1
disable_existing_loggers: false

formatters:
  plain:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S%z"
  json:
    "()": election_intelligence.utils.logging_config.JsonFormatter

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: plain
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: plain
    filename: logs/election_intelligence.log
    maxBytes: 10485760  # 10 MB
    backupCount: 5
    encoding: utf-8

root:
  level: INFO
  handlers: [console, file]

loggers:
  election_intelligence:
    level: INFO
    handlers: [console, file]
    propagate: false
